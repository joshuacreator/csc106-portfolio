    <text x="842" y="280" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#17211b">Amara Okafor</text>
    <text x="842" y="298" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#837865">Verified recipient</text>
