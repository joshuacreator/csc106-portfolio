    <path d="M784 188h12M791 183l5 5-5 5" fill="none" stroke="#f7efe0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="918" y="193" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#17211b">Send money</text>

