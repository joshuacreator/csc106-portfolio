    <text x="782" y="508" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#968a76">PAYMENT METHOD</text>
    <rect x="782" y="522" width="274" height="56" rx="14" fill="#fffaf1" stroke="#d8ccb7"/>
    <rect x="796" y="536" width="28" height="28" rx="7" fill="#17211b"/>
    <text x="810" y="555" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#f3ede1">K</text>
    <text x="836" y="547" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#17211b">Kira balance</text>
    <text x="836" y="563" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#837865">Available ₦86,400</text>
    <circle cx="1035" cy="550" r="6" fill="#c05a32"/>

    <rect x="782" y="600" width="274" height="48" rx="24" fill="#c05a32"/>
    <text x="919" y="630" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fffaf1">Send ₦25,000</text>
