    <text x="646" y="581" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#17211b">Transfer complete</text>
    <text x="618" y="608" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#7c7162">Reference KRA-2048</text>
