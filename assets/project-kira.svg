  <text x="82" y="378" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#b9cbb9">Transaction and money-transfer module</text>
  <text x="82" y="406" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#b9cbb9">for a live money app.</text>

  <rect x="82" y="454" width="184" height="42" rx="21" fill="#f3ede1"/>
  <text x="174" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#17211b">1,000+ DOWNLOADS</text>
  <rect x="280" y="454" width="152" height="42" rx="21" fill="none" stroke="#61776a"/>
  <text x="356" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d9e4d9">SECURE FLOW</text>

  <g>
    <rect x="736" y="84" width="366" height="612" rx="48" fill="#0f1712"/>
    <rect x="750" y="98" width="338" height="584" rx="38" fill="url(#kiraPhone)"/>
