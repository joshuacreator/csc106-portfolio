<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="kiraTitle kiraDesc">
  <title id="kiraTitle">Kira AI money-transfer module concept visual</title>
  <desc id="kiraDesc">A concept composition for a money-transfer app, showing a transfer form, recipient details, amount, and confirmation state.</desc>
  <defs>
    <linearGradient id="kiraBg" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#17211b"/>
      <stop offset="0.62" stop-color="#24382b"/>
      <stop offset="1" stop-color="#3d2a1f"/>
    </linearGradient>
    <linearGradient id="kiraPhone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efe0"/>
      <stop offset="1" stop-color="#e9dfcc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="780" fill="url(#kiraBg)"/>
  <circle cx="1070" cy="174" r="280" fill="#c05a32" opacity="0.14"/>
  <circle cx="170" cy="694" r="240" fill="#d9b46a" opacity="0.08"/>
  <path d="M600 0v780M740 0v780M880 0v780" stroke="#f3ede1" stroke-width="1" opacity="0.05"/>

  <text x="78" y="118" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.6" fill="#d9b46a">FINTECH · 2025—2026</text>
  <text x="78" y="238" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#f3ede1">Money in</text>
