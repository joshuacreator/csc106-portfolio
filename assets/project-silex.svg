<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="silexTitle silexDesc">
  <title id="silexTitle">Silex Secure Lab performance and quality concept visual</title>
  <desc id="silexDesc">A concept composition showing three result panels: 60 percent faster app speed, 45 percent less memory use, and test coverage raised from 0 to 65 percent.</desc>
  <defs>
    <linearGradient id="silexBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d7"/>
      <stop offset="1" stop-color="#e2d4bd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="780" fill="url(#silexBg)"/>
  <circle cx="1102" cy="122" r="230" fill="#c05a32" opacity="0.09"/>
  <path d="M0 0h1200v780H0z" fill="none" stroke="#c6b8a2" stroke-width="1" opacity="0.6"/>
  <path d="M80 0v780M1120 0v780" stroke="#c6b8a2" stroke-width="1" opacity="0.45"/>

  <text x="80" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2.6" fill="#b8512d">PERFORMANCE &amp; QUALITY · 2023—2024</text>
  <text x="80" y="222" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#1b241e">Silex Secure Lab</text>
  <text x="80" y="262" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#4c564e">Making an existing app faster, lighter, and safer to change.</text>

  <g>
    <rect x="80" y="322" width="320" height="274" rx="24" fill="#fffaf1" stroke="#d6c8b2"/>
    <text x="112" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#7a7162">APP SPEED</text>
    <text x="112" y="472" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#1b241e">60%</text>
    <text x="112" y="506" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#4c564e">faster</text>
    <path d="M112 552h256" stroke="#e5dac8" stroke-width="2"/>
    <path d="M112 552h164" stroke="#b8512d" stroke-width="8" stroke-linecap="round"/>
    <path d="M304 536l16 16-16 16" fill="none" stroke="#b8512d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g>
    <rect x="430" y="322" width="320" height="274" rx="24" fill="#1b241e"/>
    <text x="462" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#a9bbac">MEMORY USE</text>
    <text x="462" y="472" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#f3ede1">45%</text>
    <text x="462" y="506" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9dcb9">less</text>
    <rect x="462" y="536" width="256" height="18" rx="9" fill="#304636"/>
    <rect x="462" y="536" width="180" height="18" rx="9" fill="#7fae86"/>
    <circle cx="642" cy="545" r="14" fill="#f3ede1"/>
    <path d="M636 545h12" stroke="#1b241e" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g>
    <rect x="780" y="322" width="340" height="274" rx="24" fill="#b8512d"/>
    <text x="812" y="368" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#f6d8c8">TEST COVERAGE</text>
    <text x="812" y="472" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#fffaf1">65%</text>
    <text x="812" y="506" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f6d8c8">from 0%</text>
    <g fill="#fffaf1" opacity="0.94">
      <rect x="812" y="530" width="28" height="28" rx="6"/>
      <rect x="850" y="530" width="28" height="28" rx="6"/>
      <rect x="888" y="530" width="28" height="28" rx="6"/>
      <rect x="926" y="530" width="28" height="28" rx="6"/>
      <rect x="964" y="530" width="28" height="28" rx="6" opacity="0.5"/>
      <rect x="1002" y="530" width="28" height="28" rx="6" opacity="0.5"/>
    </g>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">
    <rect x="80" y="642" width="196" height="38" rx="19" fill="none" stroke="#b6a78f"/>
    <text x="178" y="666" text-anchor="middle" fill="#4c564e">FLUTTER · DART</text>
    <rect x="288" y="642" width="232" height="38" rx="19" fill="none" stroke="#b6a78f"/>
    <text x="404" y="666" text-anchor="middle" fill="#4c564e">AUTOMATED TESTING</text>
    <rect x="532" y="642" width="212" height="38" rx="19" fill="none" stroke="#b6a78f"/>
    <text x="638" y="666" text-anchor="middle" fill="#4c564e">PROFILING</text>
  </g>
  <text x="1120" y="706" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" fill="#7c7162">CONTRACT ENGAGEMENT</text>
</svg>
